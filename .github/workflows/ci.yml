name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore modshell-cs.csproj

      - name: Build
        run: dotnet build modshell-cs.csproj -c Release --no-restore

      - name: Publish (win-x64, self-contained)
        run: dotnet publish modshell-cs.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: modshell-cs-win-x64
          path: publish/
          retention-days: 14
